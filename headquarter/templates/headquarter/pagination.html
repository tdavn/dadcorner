
<section id="blog-pagination" class="blog-pagination section">

    <div class="container">
        <div class="d-flex justify-content-center">
            <ul>
            {% if page.has_previous %}
            <li><a href="?page={{ page.previous_page_number }}"><i class="bi bi-chevron-left"></i></a></li>
            {% endif %}
            <!-- <li><a href="#">1</a></li> -->
            <li><a href="#" class="active">{{ page.number }}/{{ page.paginator.num_pages }}</a></li>
            <!-- <li><a href="#">3</a></li>
            <li><a href="#">4</a></li>
            <li>...</li>
            <li><a href="#">10</a></li> -->
            {% if page.has_next %}
            <li><a href="?page={{ page.next_page_number }}"><i class="bi bi-chevron-right"></i></a></li>
            {% endif %}
            </ul>
        </div>
    </div>

</section><!-- /Blog Pagination Section -->
